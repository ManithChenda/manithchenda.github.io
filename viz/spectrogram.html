<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viz · spectrogram field</title>
<style>
  :root{--bg:#16181a;--fg:#c3c9c1;--dim:#6b726a;--accent:#6fce9a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #2b2f31;font-size:13px}
  header a{color:var(--accent);text-decoration:none}
  h1{font-size:14px;font-weight:700;margin:0;color:#e8ece6}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:24px}
  canvas{width:100%;flex:1;background:#0d0f0e;border:1px solid #2b2f31;border-radius:8px}
  .note{font-size:11.5px;color:var(--dim);max-width:70ch;line-height:1.7}
</style>
</head>
<body>
<header><h1>spectrogram_field.js</h1><a href="./">cd ../viz</a></header>
<main>
  <canvas id="c"></canvas>
  <p class="note">A scrolling synthetic spectrogram: time on the x-axis, frequency on the y-axis, brightness for energy. Moving formants sweep through the field the way vowels do in speech.</p>
</main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=c.clientWidth;c.height=c.clientHeight;}
addEventListener('resize',resize);resize();
let t=0;
function col(){
  const w=c.width,h=c.height;
  const img=x.getImageData(1,0,w-1,h);x.putImageData(img,0,0);
  for(let y=0;y<h;y++){
    const f=1-y/h;
    let e=0;
    e+=Math.exp(-Math.pow((f-(0.15+0.05*Math.sin(t*0.9)))/0.03,2));
    e+=0.8*Math.exp(-Math.pow((f-(0.4+0.12*Math.sin(t*0.6+1)))/0.04,2));
    e+=0.6*Math.exp(-Math.pow((f-(0.7+0.1*Math.sin(t*0.4+2)))/0.05,2));
    e+=0.06*Math.random();
    e=Math.min(1,e);
    const g=Math.floor(40+e*180),r=Math.floor(e*60),b=Math.floor(30+e*90);
    x.fillStyle='rgb('+r+','+g+','+b+')';
    x.fillRect(w-1,y,1,1);
  }
  t+=0.05;requestAnimationFrame(col);
}
col();
</script>
</body>
</html>
