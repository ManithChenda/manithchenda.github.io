<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viz · additive waveform</title>
<style>
  :root{--bg:#16181a;--fg:#c3c9c1;--dim:#6b726a;--accent:#6fce9a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #2b2f31;font-size:13px}
  header a{color:var(--accent);text-decoration:none}
  h1{font-size:14px;font-weight:700;margin:0;color:#e8ece6}
  main{flex:1;display:flex;flex-direction:column;gap:16px;padding:24px}
  canvas{width:100%;flex:1;background:#111314;border:1px solid #2b2f31;border-radius:8px}
  .ctl{display:flex;gap:24px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
  .ctl label{display:flex;gap:10px;align-items:center}
  input[type=range]{accent-color:var(--accent)}
  .note{font-size:11.5px;color:var(--dim);max-width:70ch;line-height:1.7}
</style>
</head>
<body>
<header><h1>additive_waveform.js</h1><a href="./">cd ../viz</a></header>
<main>
  <canvas id="c"></canvas>
  <div class="ctl">
    <label>harmonics <input id="h" type="range" min="1" max="12" value="5"></label>
    <label>decay <input id="d" type="range" min="1" max="100" value="55"></label>
    <label>speed <input id="s" type="range" min="0" max="100" value="40"></label>
  </div>
  <p class="note">A sum of sine partials — the building blocks of how a machine decomposes sound. Each harmonic adds a higher-frequency component; decay controls how quickly upper partials fall off, shaping timbre.</p>
</main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const H=document.getElementById('h'),D=document.getElementById('d'),S=document.getElementById('s');
let t=0;
function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;}
addEventListener('resize',resize);resize();
function frame(){
  const w=c.width,ht=c.height;x.clearRect(0,0,w,ht);
  const n=+H.value,decay=+D.value/100,spd=+S.value/1000;t+=spd;
  x.strokeStyle='#2b2f31';x.lineWidth=devicePixelRatio;
  x.beginPath();x.moveTo(0,ht/2);x.lineTo(w,ht/2);x.stroke();
  x.strokeStyle='#6fce9a';x.lineWidth=2*devicePixelRatio;x.beginPath();
  for(let px=0;px<w;px++){
    const u=px/w*Math.PI*4;let y=0,amp=1,norm=0;
    for(let k=1;k<=n;k++){y+=amp*Math.sin(k*u+t*k);norm+=amp;amp*=decay;}
    y=(y/norm)*ht*0.36+ht/2;
    px===0?x.moveTo(px,y):x.lineTo(px,y);
  }
  x.stroke();requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
