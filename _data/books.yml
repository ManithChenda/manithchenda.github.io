#   text instead of an anchor.
- hue: "#3f6b53"
  link: "#"
  en:
    title: "The Book of Why"
    author: "J. Pearl"
    note: "Reframed how I ask whether a model has actually learned a cause or just a correlation in the room."
  km:
    title: "The Book of Why"
    author: "J. Pearl"
    note: "បានផ្លាស់ប្តូររបៀបដែលខ្ញុំសួរថាតើគំរូបានរៀនមូលហេតុពិត ឬគ្រាន់តែជាទំនាក់ទំនងក្នុងបន្ទប់។"

- hue: "#4a5f7a"
  link: "#"
  en:
    title: "An Introduction to the Analysis of Algorithms"
    author: "Sedgewick & Flajolet"
    note: "The book that made asymptotics feel like something you could hold."
  km:
    title: "An Introduction to the Analysis of Algorithms"
    author: "Sedgewick & Flajolet"
    note: "សៀវភៅដែលធ្វើឱ្យ asymptotics មានអារម្មណ៍ដូចជាអ្វីដែលអាចកាន់បាន។"

